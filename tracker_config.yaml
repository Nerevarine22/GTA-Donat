tracker_type: tracktrack
track_high_thresh: 0.25
track_low_thresh: 0.10
new_track_thresh: 0.45
track_buffer: 60
match_thresh: 0.70
lost_match_thr: 0.80

iou_weight: 0.50
reid_weight: 0.50
conf_weight: 0.10
angle_weight: 0.05

penalty_p: 0.20
penalty_q: 0.40
reduce_step: 0.05
tai_thr: 0.55
